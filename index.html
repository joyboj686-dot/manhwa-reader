<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manhwa Reader — Free</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#0f0f12;color:#fff}
header{position:sticky;top:0;z-index:10;background:#101010;padding:12px 20px;display:flex;gap:14px;align-items:center;border-bottom:2px solid #c6121f}
header b{font-size:20px;cursor:pointer}header b span{color:#ff2a3c}
header input{margin-left:auto;padding:9px 12px;border-radius:8px;border:0;width:200px}
.badge{background:#c6121f;border-radius:999px;padding:2px 8px;font-size:12px}
main{max-width:980px;margin:0 auto;padding:20px}
.hero{background:linear-gradient(135deg,#c6121f,#5b0a12);border-radius:16px;padding:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.card{background:#1a1a20;border-radius:14px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:260px;object-fit:cover;display:block}
.card div{padding:12px}.card h3{margin:0 0 6px;font-size:16px}.card p{margin:0;color:#aaa;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.chips button{background:#222;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer}
.chips button.on{background:#c6121f}
button{cursor:pointer}
.view{display:none}.view.on{display:block}
.chap{display:flex;justify-content:space-between;background:#1a1a20;padding:12px 14px;border-radius:10px;margin:8px 0;cursor:pointer}
.chap:hover{background:#25252e}
.panel{max-width:760px;margin:0 auto}
.panel img{width:100%;display:block}
.nar{background:#f5eeda;color:#111;padding:14px 18px;margin:12px auto;max-width:760px;border-left:4px solid #c6121f;font-style:italic}
.dlg{background:#fff;color:#111;padding:12px 16px;margin:10px auto;max-width:560px;border-radius:18px;text-align:center}
.sfx{text-align:center;color:#ff2a3c;font-weight:800;letter-spacing:2px;padding:8px}
.bar{position:sticky;top:57px;z-index:9;background:#101010;padding:10px;display:flex;gap:10px;align-items:center}
.bar button{background:#222;color:#fff;border:1px solid #333;padding:8px 12px;border-radius:8px}
.bar button.primary{background:#c6121f;border:0}
#prog{height:4px;background:#c6121f;width:0%}
.meta{color:#aaa;font-size:14px}
</style></head>
<body>
<header><b onclick="go('home')">Manhwa <span>Reader</span></b><span>Bookmarks <span class="badge" id="bmCount">0</span></span><input id="q" placeholder="Search manhwa..." oninput="filter()"></header>
<div id="prog"></div>
<main id="home" class="view on">
<div class="hero"><h1 style="margin:0">Read manhwa free, vertical scroll.</h1><p>4 original sample series • 12 chapters • No login needed. Replace with your own titles.</p></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<h2>Latest Updates</h2><div id="latest"></div>
<p class="meta">Free on Vercel • Bookmarks save in your browser • For your own / licensed manhwa only.</p>
</main>
<main id="series" class="view">
<button onclick="go('home')">← All series</button>
<div id="sDetail"></div>
<h3>Chapters</h3><div id="chapList"></div>
</main>
<main id="reader" class="view">
<div class="bar"><button onclick="backToSeries()">← Series</button><b id="rtitle"></b><span id="rchap" style="margin-left:auto"></span><button onclick="prevChap()">← Prev</button><button class="primary" onclick="nextChap()">Next →</button></div>
<div id="pages"></div>
<div style="text-align:center;padding:24px"><button onclick="nextChap()" style="padding:12px 22px;background:#c6121f;color:#fff;border:0;border-radius:10px">Next Chapter →</button></div>
</main>
<script>
const S=[
{id:1,title:"Sword of the Silent Moon",genre:"Murim",rating:"9.2",status:"Ongoing",img:"https://picsum.photos/seed/moon/400/560",desc:"A silent swordsman returns after 10 years to reclaim his sect.",syn:"Ten years ago, Yoon Ha was betrayed and left for dead. Now the silent moon rises again, and his sword remembers every name.",chapters:[{n:1,t:"The Return"},{n:2,t:"Moonlight Duel"},{n:3,t:"The Sect Gate"}]},
{id:2,title:"The Last Alchemist",genre:"Fantasy",rating:"9.0",status:"Completed",img:"https://picsum.photos/seed/alch/400/560",desc:"Alchemy, curses and a second chance.",syn:"Elena sold her memories to save her brother. One last transmutation can buy them back — if she survives the price.",chapters:[{n:1,t:"Lead to Gold"},{n:2,t:"The Price"},{n:3,t:"Final Transmutation"}]},
{id:3,title:"Dungeon Chef",genre:"Action",rating:"8.8",status:"Ongoing",img:"https://picsum.photos/seed/chef/400/560",desc:"He cooks monsters to survive the dungeon.",syn:"Kicked from his party, Ryo discovers monster meat cooked right grants powers. Now the dungeon's best chef is also its deadliest hunter.",chapters:[{n:1,t:"First Dish"},{n:2,t:"Spice of Fire"},{n:3,t:"The Boss Table"}]},
{id:4,title:"My Guild Is Broke",genre:"Comedy",rating:"8.6",status:"Ongoing",img:"https://picsum.photos/seed/guild/400/560",desc:"The weakest guild, the biggest debts.",syn:"The Silver Leaf guild owes 10,000 gold and has 3 members. Their plan to get rich? Take the quest no one else will touch.",chapters:[{n:1,t:"Debt Collectors"},{n:2,t:"The Cursed Quest"},{n:3,t:"Payday"}]}];
let curGenre="All",cur=null,curCh=1;
let bm=JSON.parse(localStorage.getItem("bm")||"[]");
function saveBm(){localStorage.setItem("bm",JSON.stringify(bm));document.getElementById("bmCount").textContent=bm.length;}
saveBm();
const genres=["All",...new Set(S.map(s=>s.genre))];
document.getElementById('chips').innerHTML=genres.map(g=>`<button class="${g==='All'?'on':''}" onclick="setGenre('${g}',this)">${g}</button>`).join('');
function go(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));document.getElementById(v).classList.add('on');window.scrollTo(0,0);}
function render(list){document.getElementById('grid').innerHTML=list.map(s=>`<div class="card" onclick="openSeries(${s.id})"><img src="${s.img}" alt="${s.title}"><div><h3>${s.title}</h3><p>★ ${s.rating} • ${s.genre} • ${s.status} • ${s.chapters.length} ch</p><p>${s.desc}</p></div></div>`).join('');
document.getElementById('latest').innerHTML=S.flatMap(s=>s.chapters.map(c=>({s,c}))).slice(-6).reverse().map(x=>`<div class="chap" onclick="openReader(${x.s.id},${x.c.n})"><span>${x.s.title} — Ch. ${x.c.n} ${x.c.t}</span><span class="meta">New</span></div>`).join('');}
function setGenre(g,el){curGenre=g;document.querySelectorAll('.chips button').forEach(b=>b.classList.remove('on'));el.classList.add('on');filter();}
function filter(){const q=document.getElementById('q').value.toLowerCase();render(S.filter(s=>(curGenre==='All'||s.genre===curGenre)&&s.title.toLowerCase().includes(q)));}
function openSeries(id){cur=S.find(s=>s.id===id);document.getElementById('sDetail').innerHTML=`<div style="display:flex;gap:16px;flex-wrap:wrap"><img src="${cur.img}" style="width:180px;border-radius:12px"><div><h2 style="margin:0">${cur.title}</h2><p class="meta">★ ${cur.rating} • ${cur.genre} • ${cur.status}</p><p>${cur.syn}</p><button onclick="toggleBm(${cur.id})" style="padding:10px 16px;background:#c6121f;color:#fff;border:0;border-radius:10px">${bm.includes(cur.id)?'★ Bookmarked':'☆ Bookmark'}</button> <button onclick="openReader(${cur.id},1)" style="padding:10px 16px;background:#fff;color:#111;border:0;border-radius:10px">Start Reading Ch. 1 →</button></div></div>`;
document.getElementById('chapList').innerHTML=cur.chapters.map(c=>`<div class="chap" onclick="openReader(${cur.id},${c.n})"><span>Chapter ${c.n} — ${c.t}</span><span>→</span></div>`).join('');go('series');}
function toggleBm(id){bm=bm.includes(id)?bm.filter(x=>x!==id):[...bm,id];saveBm();openSeries(id);}
function openReader(id,n){cur=S.find(s=>s.id===id);curCh=n;const ch=cur.chapters.find(c=>c.n===n);document.getElementById('rtitle').textContent=cur.title;document.getElementById('rchap').textContent='Chapter '+n+' — '+ch.t;
document.getElementById('pages').innerHTML=[1,2,3,4,5].map(i=>{const seed=`${cur.id}-${n}-${i}`;const nar=i===1?`<div class="nar">“${ch.t}.” — ${cur.title}, Chapter ${n}.</div>`:'';const dlg=i===3?`<div class="dlg">“I won't run this time.”</div>`:'';const sfx=i===2?`<div class="sfx">SLASH!</div>`:'';return `${nar}<div class="panel"><img src="https://picsum.photos/seed/${seed}/760/1000" alt="Page ${i}"></div>${dlg}${sfx}`;}).join('');go('reader');}
function nextChap(){if(curCh<cur.chapters.length){openReader(cur.id,curCh+1);}else alert('You are caught up!');}
function prevChap(){if(curCh>1)openReader(cur.id,curCh-1);}
function backToSeries(){openSeries(cur.id);}
window.addEventListener('scroll',()=>{const h=document.documentElement;document.getElementById('prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';});
render(S);
</script></body></html>
